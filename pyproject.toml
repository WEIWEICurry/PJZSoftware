[project]
name = "pjzsoftware"
version = "0.6.0"
description = "Local personal ledger foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "filelock",
    "python-multipart",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy", "pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/pjz"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend/pjz"]
