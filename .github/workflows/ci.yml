name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.10"
      - run: uv sync --locked
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/export_contract.py --check
      - run: npm ci
        working-directory: frontend
      - run: npm run contract
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api-schema.d.ts
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install chromium --only-shell
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: uv run python -m pjz --self-test
      - run: ./scripts/build.ps1
      - run: uv run python scripts/package_probe.py
